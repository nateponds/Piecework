name: Rebuild site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-site
  # Do not let an older queued run cancel a newer deployment.
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Hobby blocks CLI deploys whose git author is not the Vercel owner.
      # Rewrite author only on this runner; origin history is unchanged.
      - name: Present commit as Vercel owner
        run: |
          git config user.name "nateponds"
          git config user.email "nathanielryanponce@gmail.com"
          git commit --amend --no-edit --reset-author

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Install Vercel CLI
        run: npm install --global vercel@59.23.1

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production

      - name: Build
        run: vercel build --prod

      - name: Deploy
        id: deploy
        run: |
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "Skipping stale deployment: origin/main is ${main_sha}, run is ${GITHUB_SHA}."
            exit 0
          fi

          url="$(vercel deploy --prebuilt --prod --yes)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed ${url}"
